<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard</title>
<style>
  :root {
    --bg: #f5f7fa; --surface: #ffffff; --text: #1c2430; --muted: #6b7686;
    --line: #dfe4ec; --accent: #1f6feb; --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --surface: #1a2029; --text: #e8ecf2; --muted: #8d98a8;
      --line: #2a3340; --accent: #4c8dff; --accent-ink: #0b1220;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .dashboard {
    width: 100%; max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 30px 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.05);
    text-align: center;
  }
  h1 { font-size: 1.5rem; margin-top: 0; margin-bottom: 25px; }
  
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  .app-card {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  }
  .app-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    border-color: var(--accent);
  }
  .app-icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: var(--accent);
    color: var(--accent-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    margin-bottom: 12px;
    box-shadow: 0 4px 10px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .app-icon svg {
    width: 28px;
    height: 28px;
  }
  .app-title {
    font-size: 0.95rem;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="dashboard">
  <h1>Admin Panel</h1>
  
  <div class="cards-grid">
    <!-- Upload File Card -->
    <a href="add.html" class="app-card">
      <div class="app-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15V3m0 0l-4 4m4-4l4 4M2 17l.621 2.485A2 2 0 0 0 4.561 21h14.878a2 2 0 0 0 1.94-1.515L22 17"/>
        </svg>
      </div>
      <div class="app-title">Upload File</div>
    </a>

    <!-- Download File Card -->
    <a href="index.html" class="app-card">
      <div class="app-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12m0 0l-4-4m4 4l4-4M4 20h16"/>
        </svg>
      </div>
      <div class="app-title">Download File</div>
    </a>
  </div>
</div>

</body>
</html>
