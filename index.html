<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Downloads</title>
<style>
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --text: #1c2430;
    --muted: #6b7686;
    --line: #dfe4ec;
    --accent: #1f6feb;
    --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c;
      --surface: #1a2029;
      --text: #e8ecf2;
      --muted: #8d98a8;
      --line: #2a3340;
      --accent: #4c8dff;
      --accent-ink: #0b1220;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 60px; }
  h1 { font-size: 1.6rem; margin: 0 0 20px; }

  .search {
    position: relative;
    margin-bottom: 20px;
  }
  .search svg {
    position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%);
    width: 20px; height: 20px; color: var(--muted);
  }
  .search input {
    width: 100%;
    padding: 14px 16px 14px 44px;
    font-size: 1rem;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }

  ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  li {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  li:last-child { border-bottom: 0; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: .85rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dl {
    flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px;
    border-radius: 8px;
    background: var(--accent); color: var(--accent-ink);
    text-decoration: none;
  }
  .dl:hover { opacity: .88; }
  .dl:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .dl svg { width: 20px; height: 20px; }
  .empty { display: none; padding: 28px 16px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Files</h1>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search files..." autocomplete="off" aria-label="Search files">
  </div>

  <ul id="list"></ul>
  <div class="empty" id="empty">Loading...</div>
</main>

<script>
  const API = "https://script.google.com/macros/s/AKfycbzXveLmrx0ZfozK0d-qDNjTbl-WtlfP79oDrKD88Uj6sFTIQ3tdjt8QSAAQUQg72yiPpg/exec";
  const q = document.getElementById('q');
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg>';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function size(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }
  function render(files) {
    list.innerHTML = files.map(f => {
      const url = String(f.url || '').startsWith('https://') ? f.url : '#';
      const meta = esc(f.type) + ' · ' + size(f.size) + (f.description ? ' · ' + esc(f.description) : '');
      return '<li data-name="' + esc((f.name + ' ' + f.fileName + ' ' + f.type).toLowerCase()) + '">' +
        '<div class="info"><div class="name">' + esc(f.name) + '</div><div class="meta">' + meta + '</div></div>' +
        '<a class="dl" href="' + esc(url) + '" download aria-label="Download ' + esc(f.name) + '">' + ICON + '</a></li>';
    }).join('');
    filter();
  }
  function filter() {
    const term = q.value.trim().toLowerCase();
    const items = list.querySelectorAll('li');
    let shown = 0;
    items.forEach(li => {
      const ok = li.dataset.name.includes(term);
      li.style.display = ok ? '' : 'none';
      if (ok) shown++;
    });
    empty.textContent = items.length ? 'Kono file pawa jayni.' : 'Ekhono kono file nei.';
    empty.style.display = shown ? 'none' : 'block';
  }
  q.addEventListener('input', filter);

  fetch(API + '?action=list')
    .then(r => r.json())
    .then(d => { if (!d.ok) throw new Error(d.error); render(d.files || []); })
    .catch(() => { empty.textContent = 'List load hoyni. Internet ar script deploy check korun.'; empty.style.display = 'block'; });
</script>
</body>
</html>
